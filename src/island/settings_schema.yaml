// ==BunbunSettings==
/*
- Appearance:
  - Position: top-center
    $name: Position
    $description: Where the island should appear on your screen.
    $options:
      - top-center: Top Center
      - top-left: Top Left
      - top-right: Top Right
      - bottom-center: Bottom Center
      - bottom-left: Bottom Left
      - bottom-right: Bottom Right
  - TargetMonitor: primary
    $name: Target Monitor
    $description: Select the screen to display the island. If a display isn't found, it safely falls back to the Primary Monitor.
    $options:
      - 'primary': Primary Monitor
      - '1': Display 1
      - '2': Display 2
      - '3': Display 3
      - '4': Display 4
      - '5': Display 5
      - 'follow': Follow Mouse (Active Monitor)
  - Displays: single
    $name: Displays
    $description: single = only the Target Monitor; all = the island on the Target Monitor plus a mirror on every other display.
    $options:
      - single: One display
      - all: All displays
  - MirrorPosition: same
    $name: Mirror position
    $description: Where mirrors sit on the other displays (same = like the main island).
  - DisplayPositions: ""
    $name: Per-display positions
    $description: 'Optional overrides by display number, e.g. 2=bottom-center;3=top-left'
  - OffsetX: 0
    $name: Offset X
    $description: Adjust the horizontal position (in pixels). Positive values move it right, negative values move it left.
  - OffsetY: 0
    $name: Offset Y
    $description: Adjust the vertical position (in pixels). Positive values move it down, negative values move it up. Applies to every state unless the separate expanded offset below is turned on, in which case this becomes the collapsed/idle offset.
  - SeparateExpandedOffsetY: false
    $name: Use a separate Offset Y when expanded
    $description: Lets the island sit at one height while collapsed and a different one while expanded. Useful for tucking the idle pill up near the screen edge while keeping the expanded dashboard somewhere comfortable to interact with.
  - OffsetYExpanded: 0
    $name: Offset Y (expanded)
    $description: Vertical position in pixels while the island is expanded. Only used when the separate expanded offset above is on. The island eases between this and Offset Y as it expands and collapses, so the two never snap.
  - BorderMergedMode: false
    $name: Border-Merged Mode
    $description: Attach the island flush to the top edge of the monitor without a floating gap.
  - ShapeStyle: default
    $name: Island Shape Style
    $description: Change the overall shape of the island (Pill, Windows 11, or macOS Notch).
    $options:
      - default: Default (Apple Pill)
      - w11: Windows 11 (Rounded Box)
      - notch: macOS Notch (Top Edge Flush)
  - ProgressStyle: slim
    $name: Progress bar style
    $description: Look of the song progress bar in the expanded media player. Wavy and Squiggle animate while music is playing and flatten when paused.
    $options:
      - slim: Slim (classic bar)
      - wavy: Wavy
      - squiggle: Squiggle (slower, subtler wave)
      - bar: Bar (thick bar with a line thumb)
  - SpectrumStyle: bars
    $name: Audio spectrum style
    $description: Look of the live audio visualizer next to the album art (collapsed pill and expanded player). Pulse Orb, Plasma Thread and Peak Matrix use a real frequency analysis of the system audio, and each plays its own animation when the track changes.
    $options:
      - bars: Classic Bars
      - led: Peak Matrix
      - plasma: Plasma Thread
      - orb: Pulse Orb
  - SizeScale: '1.0'
    $name: Size scale
    $description: Makes the entire island and its contents larger or smaller.
    $options:
      - '0.8': 0.8x
      - '1.0': 1.0x
      - '1.2': 1.2x
      - '1.5': 1.5x
      - '1.8': 1.8x
      - '2.0': 2.0x
      - '2.5': 2.5x
  - AutoDpiScale: true
    $name: Auto DPI scaling
    $description: Automatically scales the island to match your monitor's DPI. Recommended for 4K screens.
  $name: Appearance & Position
- Behavior:
  - AlwaysOnTop: true
    $name: Always on top
    $description: Keeps the island above all other windows. Turn this off if it blocks other apps.
  - ExpandOnHover: true
    $name: Expand on hover
    $description: Expand the island automatically when hovered. If disabled, click to expand.
  - AutoHideIdleSeconds: '0'
    $name: Auto-hide island (all states)
    $description: Hide the island (including idle, media, and other states) after this many seconds of inactivity. 0 to disable.
    $options:
      - '-1': Hide instantly
      - '0': Never hide (default)
      - '5': Hide after 5 seconds
      - '10': Hide after 10 seconds
      - '30': Hide after 30 seconds
      - '60': Hide after 60 seconds
  - AutoHideFullscreen: true
    $name: Hide on full screen
    $description: Automatically hide the island when playing a video or app in full screen mode.
  - FullscreenTuck: false
    $name: Tuck instead of hiding
    $description: In full screen, fold the island into a thin line instead of hiding it. Point at the line to bring the island back; it unfolds by itself when you leave full screen, and when an agent needs you.
  - UnhideOnHover: true
    $name: Unhide on hover
    $description: Allow the hidden island to reappear when you hover your mouse over it.
  $name: Behavior & Visibility
- Animations:
  - TargetFPS: auto
    $name: Refresh rate / FPS
    $description: Set the animation frame rate. Choose Auto to dynamically match your active monitor's refresh rate (up to 360Hz/500Hz), or select a fixed FPS.
    $options:
      - auto: Auto (Match Monitor Refresh Rate)
      - '60': 60 FPS (Eco / Standard)
      - '90': 90 FPS
      - '120': 120 FPS
      - '144': 144 FPS
      - '165': 165 FPS
      - '240': 240 FPS
      - '360': 360 FPS (Ultra Smooth)
      - '500': 500 FPS (Maximum / Uncapped)
  - AnimationStyle: default
    $name: Animation bounciness / style
    $description: Control the spring physics and feel of the animation.
    $options:
      - smooth: Smooth (No bounciness / Critically damped)
      - default: Default (Balanced Apple-like spring)
      - bouncy: Bouncy (Dynamic elastic spring)
      - snappy: Snappy (High stiffness, quick settle)
  - PowerSaver: auto
    $name: Battery saver
    $description: Fewer wakeups and lower animation frame rates so the island sips power. Auto turns it on while the PC runs on battery or Windows battery saver is on.
    $options:
      - auto: Auto (on battery)
      - always: Always
      - never: Off
  - AnimationSpeed: normal
    $name: Animation speed
    $description: How fast the island expands and collapses.
    $options:
      - very-slow: Very Slow (0.5x)
      - slow: Slow (0.75x)
      - normal: Normal (1.0x)
      - fast: Fast (1.35x)
      - very-fast: Very Fast (1.65x)
      - ultra-fast: Ultra Fast (2.0x)
  - ExpandedMediaTransitions: false
    $name: Expanded player transitions
    $description: Animate the hover player when the song changes or you press a control - title, artist and album text, the cover flip, and the previous / next / play-pause buttons. Turn off to make them change instantly.
  - PillCoverSpin: false
    $name: Pill cover spin
    $description: Spin the album cover in the collapsed pill when the song changes. Turn off to swap the cover instantly.
  $name: Animations & Performance
- Themes:
  - ThemePreset: obsidian
    $name: Theme preset
    $description: Select a curated color theme, or choose Custom to use your own hex colors below.
    $options:
      - obsidian: Obsidian - true black (Default)
      - graphite: Graphite - neutral Windows 11 dark
      - slate: Slate - cool blue-grey
      - nord: Nord - the Nord palette
      - evergreen: Evergreen - deep green
      - espresso: Espresso - warm brown
      - plum: Plum - muted mauve
      - porcelain: Porcelain - light theme
      - custom: Custom Colors (Use Hex Below)
  - PillOpacity: 96
    $name: Pill transparency
    $description: 35 to 100. Lower values make the island more see-through.
  - TintIntensity: 72
    $name: Background tint intensity
    $description: 0 to 100. Controls how dark the background tint behind the island is.
  - BackdropMaterial: none
    $name: Backdrop material (real Windows blur)
    $description: Paints genuine Windows blur or acrylic behind the island so your desktop and windows show through it, using the same effect the system uses for its own surfaces. Acrylic adds Windows' frosted grain and a tint of your background colour (see Acrylic tint strength). Requires Windows 10 1803 or newer, and Windows' Transparency effects must be turned ON (Settings > Personalization > Colors > Transparency effects, or on Windows 11 also Settings > Accessibility > Visual effects). If it is off, or Battery saver is on, you will only see a flat tint with no blur. When this is on, use Backdrop fill opacity below to control how much of the blur comes through.
    $options:
      - none: Off (solid background)
      - blur: Blur
      - acrylic: Acrylic (frosted)
  - BackdropFillOpacity: 45
    $name: Backdrop fill opacity
    $description: 0 to 100. Only used when a Backdrop material is enabled. How opaque the island's own background stays on top of the blur - lower values let more of the blurred desktop through. Has no effect when the backdrop is Off.
  - BackdropTint: 55
    $name: Acrylic tint strength
    $description: 0 to 100. How strongly your background colour tints the backdrop. Acrylic uses the full strength; Blur uses a lighter wash of the same colour so the desktop stays readable.
  - MaterialDepth: true
    $name: Depth shading
    $description: Adds soft downward shading and the accent wash so the island has depth instead of looking like one flat fill. No edge highlights or rim lighting are involved. Turn off for a completely flat look.
  - DropShadow: true
    $name: Soft drop shadow
    $description: Casts a soft shadow beneath the island to lift it off the desktop.
  - AccentBloom: 100
    $name: Accent bloom intensity
    $description: 0 to 200. Strength of the soft accent-coloured wash bleeding in from the top of the island. Driven by album art when the accent mode is Auto. Set to 0 to remove it.
  - TextScale: 100
    $name: Text size
    $description: 70 to 160. Scales all island text independently of the overall Size scale, so you can keep the island compact while making the clock and labels easier to read.
  - AccentColorMode: auto
    $name: Accent color mode
    $description: How the glowing accent color is chosen. Auto extracts it from album art.
    $options:
      - auto: Auto, from album art
      - system: System (Device Accent)
      - custom: Custom hex
  - CustomAccentHex: "#4cc9f0"
    $name: Custom accent hex
    $description: The hex color to use when the accent mode is set to Custom.
  - CalendarAccent: red
    $name: Calendar accent color
    $description: Accent color for the calendar's month name and today's marker. Default uses the island's accent color mode; System always uses the Windows accent.
    $options:
      - red: Default (Island accent)
      - system: System (Device Accent)
  - ClockAccentGlow: true
    $name: Show clock background circle/glow
    $description: Display the soft accent circle/glow behind the time in the expanded clock view. Turn off for a clean, minimal clock without background glow.
  - FontFamily: ""
    $name: Font family
    $description: Custom font family for island text (e.g. Segoe UI, Arial, Aptos, Consolas). Leave empty for system default.
  - ContourBorderMode: default
    $name: Contour border
    $description: Choose the island's border style. Default uses the theme's matching border, Auto extracts the border color from album art, and Borderless removes all outer border outlines.
    $options:
      - default: Default
      - auto: Auto (From album art)
      - borderless: Borderless
  - ContourBorderHex: "#1E1E22"
    $name: Contour border hex color
    $description: 'Hex color for the island contour stroke. Changing it from the default overrides the selected Theme preset; restore the default to go back to the preset.'
  - PillBgColor: "#08080A"
    $name: Pill background color
    $description: 'Hex color for the island background. Accepts 3, 4, 6 or 8 hex digits, so use the 8-digit RRGGBBAA form for a translucent background (for example 0D0D0FB0) while keeping the text and icons opaque. Changing it from the default overrides the selected Theme preset; restore the default to go back to the preset.'
  - TextPrimaryColor: "#FFFFFF"
    $name: Primary text color
    $description: 'Accessible hex color for titles and main text. Changing it from the default overrides the selected Theme preset; restore the default to go back to the preset.'
  - TextSecondaryColor: "#9B9BA5"
    $name: Secondary text color
    $description: 'Accessible hex color for artist names and muted labels. Changing it from the default overrides the selected Theme preset; restore the default to go back to the preset.'
  $name: Colors & Theming
- Indicators:
  - PrivacyDots: true
    $name: Show privacy indicators (Mic & Camera)
    $description: Master toggle to display the iOS-style privacy dots when microphone or camera is in use.
  - PrivacyDotsMic: true
    $name: Show microphone indicator (Orange dot)
    $description: Show the orange dot when microphone is in use. Turn off if background apps (like Discord/OBS) keep it permanently active.
  - PrivacyDotsMicHex: "#FF9500"
    $name: Microphone dot color
    $description: Custom hex color for microphone privacy indicator.
  - PrivacyDotsCam: true
    $name: Show camera indicator (Green dot)
    $description: Show the green dot when webcam is in use.
  - PrivacyDotsCamHex: "#34C759"
    $name: Camera dot color
    $description: Custom hex color for camera privacy indicator.
  - PrivacyDotsScreen: true
    $name: Show screen-recording indicator (Blue dot)
    $description: Show a blue dot while an app records or shares your screen through Windows' capture API (Snipping Tool, browsers, Teams). Recorders that read the screen another way, such as OBS display capture, can't be detected.
  - PrivacyDotsScreenHex: "#4F8CFF"
    $name: Screen-recording dot color
    $description: Custom hex color for the screen-recording indicator.
  $name: Privacy Indicators
- Modules:
  - Media: true
    $name: Media module
    $description: Shows album art, song info, and playback controls when music is playing.
  - MediaAutoExpand: false
    $name: Auto-expand on track change
    $description: Automatically expand the island when a new song or video starts playing. If disabled, album art updates smoothly in the collapsed pill without unprompted expansion.
  - CollapsedTitle: true
    $name: Song title in the collapsed pill
    $description: While music plays, the collapsed pill shows the song title next to the cover. Right-click the island and pick "Show lyrics on collapsed island" to show synced lyrics there instead.
  - MediaPillClock: false
    $name: Show clock in the collapsed media pill
    $description: While media is playing, the collapsed pill also shows the current time on the left, separated from the album cover by a thin divider. Hovering still opens the normal player. Uses the same 12h/24h and seconds options as the clock below. Off by default.
  - Volume: true
    $name: Volume slider flyout
    $description: Shows a volume slider banner on the island when adjusting system volume. Disable if you prefer the default Windows volume flyout.
  - Brightness: true
    $name: Brightness slider flyout
    $description: Shows a brightness slider banner on the island when you change the screen brightness. Works with a laptop's built-in display. Disable if you prefer the default Windows brightness flyout.
  - CapsLock: true
    $name: Caps Lock module
    $description: Shows an indicator when Caps Lock or Num Lock state changes.
  - Battery: true
    $name: Battery module
    $description: Shows an alert when your laptop battery is running low.
  - BluetoothIndicator: true
    $name: Bluetooth connect/disconnect indicator
    $description: Shows a card with the device name, category icon, and battery level (if available) when a Bluetooth device connects or disconnects.
  - BluetoothShowBattery: true
    $name: Show Bluetooth battery level
    $description: Reads battery level over BLE GATT when the device supports it. Not all classic Bluetooth devices report battery this way — when unavailable, only a Connected/Disconnected label is shown.
  - Progress: true
    $name: Progress module
    $description: Shows a progress ring around the island for downloads or file copies.
  - TimerModule: true
    $name: Focus Timer module
    $description: Enables a Pomodoro-style focus/break timer, startable from the island's right-click menu.
  - Clipboard: true
    $name: Clipboard module
    $description: Shows a quick preview of the text or images you just copied.
  - StatusCountdownProgress: false
    $name: Status countdown progress bar
    $description: Shows a subtle countdown progress bar at the bottom of temporary status alert cards (such as Clipboard, Notifications, and Device alerts). Disabled by default.
  - DoNotDisturbIndicator: true
    $name: Do Not Disturb status alert
    $description: Shows a status alert card when Do Not Disturb is toggled in the Windows notification panel.
  - NotificationRespectDnD: true
    $name: Notifications respect Do Not Disturb
    $description: Suppresses Dynamic Island notification alerts when Windows Do Not Disturb is active.
  - HardwareMonitorModule: true
    $name: Include Hardware Monitor in scroll loop
    $description: Add CPU, GPU, RAM, FPS and Network stats card to mouse-wheel scroll loop.
  - ConnectivityModule: true
    $name: Include Connectivity in scroll loop
    $description: Add a Wi-Fi, Bluetooth, Do Not Disturb (and, on laptops, Battery) tab to the mouse-wheel scroll loop. Click Wi-Fi or Bluetooth to turn it on or off, hold it to pick a network or device, right-click any card for its Windows settings.
  - TodoModule: true
    $name: To-do tab and reminders
    $description: 'A To-do tab in the scroll loop (click a row to tick it off) and reminder pills with Snooze and Done. Ask Bun adds them: "add buy milk", "remind me at 3pm to call Sam", "remind me in 20 min to stretch", "my list", "done buy milk". Saved on this PC only (todos.tsv next to settings.ini).'
  - ReminderSound: true
    $name: Reminder sound
    $description: Play Windows' reminder sound when a reminder is due. Change the sound itself in Windows' Sound settings → More sound settings → Sounds → Calendar Reminder.
  - QuietReminders: true
    $name: Quiet reminders
    $description: While a full-screen app runs, you're presenting, a meeting from your calendar is on, or Focus mode is on, reminders don't play a sound and show as a small pill. Tap it to see Snooze and Done.
  - CalendarIcsUrl: ""
    $name: Calendar link
    $description: Your calendar's private iCal link (Google Calendar → Settings → your calendar → "Secret address in iCal format"; Outlook.com → Settings → Shared calendars → Publish → ICS). Several links can go in, separated by spaces. Bunbun fetches it every 5 minutes to show your next meeting with a Join button. Keep it private; anyone with the link can read the calendar.
  - MeetingAlertMinutes: 10
    $name: Meeting alert (minutes before)
    $description: How long before a meeting the island shows it with a countdown and Join button. 0 turns the alert off (the calendar tab still shows what's next).
  - Downloads: true
    $name: Download progress
    $description: Shows browser downloads in your Downloads folder as they come in (name, size, speed), then "Downloaded". Click the finished pill to show the file.
  - GameOverlay: false
    $name: Enable game overlay mode
    $description: Replaces the clock with live stats like FPS, CPU, and RAM usage.
  - ShowMetricText: false
    $name: Show labels in metric chips
    $description: Adds text labels (like "CPU") inside the game overlay bars.
  - Weather: true
    $name: Weather module
    $description: Shows the weather on the right side of the pill. Turn off to only show the clock.
  - WeatherCity: ""
    $name: Weather City (Optional)
    $description: A city (e.g. London) to always show. Leave blank to show the weather where this PC is, from Windows' location service.
  - WeatherFahrenheit: false
    $name: Use Fahrenheit
    $description: Display weather temperature and wind speed in imperial units.
  - MediaTabLyrics: false
    $name: Lyrics in the media tab
    $description: Adds a lyrics button to the media player controls to toggle an immersive lyrics view over the media tab. Can also be toggled from the right-click menu.
  - Lyrics: false
    $name: Lyrics module
    $description: Shows synced lyrics for the current track (fetched from LRCLIB, a free open-source lyrics database) while the island is expanded. Scroll to the Lyrics tab to view them.
  - LyricsVisualizer: true
    $name: Show visualizer in Lyrics tab
    $description: Shows a small live audio waveform next to the Lyrics title while a track is playing.
  - KaraokeLyrics: true
    $name: Karaoke-style glow
    $description: Lights up the active lyric line progressively, left to right, in sync with the song.
  - KaraokeLetterGlow: true
    $name: Karaoke letter glow
    $description: As the karaoke light sweeps across the line, letters near the wipe boundary softly glow, then fade out behind it.
  - LyricsOffsetMs: 0
    $name: Lyrics sync offset - speakers / wired (ms)
    $description: "Fine-tunes lyric timing in milliseconds (-3000 to 3000, 1 ms steps). Positive = lyrics appear EARLIER, negative = LATER. Raise it if lyrics feel late, lower it if they feel early. Applies to every lyric view (Lyrics tab, collapsed pill, media-tab panel and the karaoke wipe). This value is used whenever the default audio output is NOT a Bluetooth device. You can also nudge it from the right-click menu under Lyrics sync."
  - LyricsOffsetBluetoothMs: 0
    $name: Lyrics sync offset - Bluetooth output (ms)
    $description: "Same as above (-3000 to 3000 ms, positive = EARLIER, negative = LATER), but used automatically while the default audio output is a Bluetooth device. Bluetooth adds latency, so lyrics usually need to be shifted LATER (a negative value) here. The island switches between the two values by itself when the output changes."
  - LyricsNeighborLinesVisible: false
    $name: Show neighboring lyric lines clearly
    $description: By default the lines above and below the active line are only a faint ghost. Turn this on to make them clearly readable.
  - LyricsCache: true
    $name: Lyrics cache (disk)
    $description: Instant lyrics, less load on LRCLIB, tiny disk use, clearable anytime. Stored in the mod's storage folder. Turn off to stop all lyrics disk reads and writes.
  - LyricsCacheMaxMB: '25'
    $name: Lyrics cache size limit
    $description: Least recently used files are deleted once the cache grows past this. Off disables the disk cache.
    $options:
      - '0': Off
      - '10': 10 MB
      - '25': 25 MB (default)
      - '100': 100 MB
  - LyricsNetEase: true
    $name: Also search NetEase
    $description: When LRCLIB has no synced lyrics for a song, also look on NetEase Cloud Music, which has many Chinese, Japanese and Korean songs. This sends the song title and artist to music.163.com. Only a match with the same title, artist and length is shown.
  - Language: auto
    $name: Language
    $description: Language for the island's own text labels. Auto follows your Windows display language.
    $options:
      - auto: Auto (Follow Windows)
      - en: English
      - fr: Français (French)
      - es: Español (Spanish)
      - de: Deutsch (German)
      - pt: Português (Portuguese)
      - it: Italiano (Italian)
      - ru: Русский (Russian)
      - tr: Türkçe (Turkish)
      - hi: हिन्दी (Hindi)
      - zh: 简体中文 (Simplified Chinese)
      - ja: 日本語 (Japanese)
      - ko: 한국어 (Korean)
  - ClockFormat: system
    $name: Clock format
    $description: Choose 12-hour or 24-hour time, or follow your Windows locale setting.
    $options:
      - system: Follow Windows locale
      - 12h: 12-hour (3:07 PM)
      - 24h: 24-hour (15:07)
  - ShowSeconds: false
    $name: Show seconds on the clock
    $description: Include seconds in the expanded clock. Costs a little more CPU because the clock then redraws every second.
  - DateFormat: ""
    $name: Custom date format
    $description: 'Custom date pattern for the idle dashboard. Leave empty to follow your Windows locale. Supports yyyy (year), MM / M (month), dd / d (day), MMM (short month name), MMMM (full month name), ddd / dddd (weekday). Any other characters are printed as-is, so CJK formats like yyyy年MM月dd日 work.'
  - DateFirst: false
    $name: Show date above the time
    $description: Swap the idle dashboard so the date is the headline and the time sits beneath it.
  - FirstDayOfWeek: auto
    $name: First day of the week
    $description: Which weekday the calendar grid starts on. Auto follows your Windows regional format.
    $options:
      - auto: Auto (Follow Windows)
      - monday: Monday
      - sunday: Sunday
  - QuickLookup: true
    $name: Quick Lookup (hotkey)
    $description: "Press the Ask Bun hotkey (set on the Assistant & agents page) to open a search box on the island. Type a word or short phrase and press Enter, or pick your clipboard text or a recent lookup. Nothing is sent anywhere until you submit a search; searches go to en.wiktionary.org and en.wikipedia.org (and api.dictionaryapi.dev as a backup dictionary). Recent lookups are kept in memory only and cleared when the mod restarts."
  - FileTrayModule: false
    $name: File Tray (drag & drop shelf)
    $description: Adds a File Tray card to the scroll loop. Drag files onto the island to park them there, then click to open one, or use the right-click menu to clear the shelf. Files are only referenced, never copied or moved.
  - FileTrayMaxItems: 10
    $name: File Tray capacity
    $description: 1 to 25. How many files the shelf keeps before the oldest one drops off.
  - FileTrayPersist: true
    $name: File Tray remembers items (disk)
    $description: Keeps the tray's contents across restarts, in the mod's storage folder. Only file paths and pasted text snippets are stored, never copies of your files. Turn off to stop all disk reads and writes and delete the saved list.
  - MediaExpandBlocklist: ""
    $name: Never auto-expand for these apps
    $description: 'Comma-separated list of app or site names that should never make the island expand on a track change, while still updating quietly in the collapsed pill. Matched loosely against the media source and title, for example: chrome, tiktok, youtube.'
  - GameOverlayShowFps: true
    $name: Game overlay - show FPS
    $description: Include the frame rate in the game overlay strip.
  - GameOverlayShowCpu: true
    $name: Game overlay - show CPU
    $description: Include CPU utilization in the game overlay strip.
  - GameOverlayShowGpu: true
    $name: Game overlay - show GPU
    $description: Include GPU utilization in the game overlay strip.
  - GameOverlayShowRam: true
    $name: Game overlay - show RAM
    $description: Include memory usage in the game overlay strip.
  - GameOverlayShowDisk: true
    $name: Game overlay - show disk
    $description: Include disk usage in the game overlay strip.
  - GameOverlayCompact: false
    $name: Game overlay - compact size
    $description: Shrink the game overlay to a narrow strip that fits neatly inside the taskbar area.
  $name: Modules & Features
- Shortcuts:
  - HideShowHotkeyEnabled: true
    $name: Enable hide/show hotkey
    $description: Toggle the island's visibility instantly with a keyboard shortcut. The hotkey is the only way to bring a hidden island back, so leave this on unless you're comfortable re-enabling it from settings.ini.
  - HideShowModifiers: ctrl_alt
    $name: Hotkey modifiers
    $description: Modifier keys combined with the letter/number key below.
    $options:
      - ctrl_alt: Ctrl + Alt
      - ctrl_shift: Ctrl + Shift
      - alt_shift: Alt + Shift
      - win_alt: Win + Alt
      - ctrl_alt_shift: Ctrl + Alt + Shift
  - HideShowKey: "D"
    $name: Hotkey letter/number key
    $description: A single A-Z or 0-9 key combined with the modifiers above. Falls back to "D" if left blank or invalid.
  - LookupModifiers: ctrl_alt
    $name: Quick Lookup hotkey modifiers
    $description: Modifier keys combined with the Quick Lookup key below.
    $options:
      - ctrl_alt: Ctrl + Alt
      - ctrl_shift: Ctrl + Shift
      - alt_shift: Alt + Shift
      - win_alt: Win + Alt
      - ctrl_alt_shift: Ctrl + Alt + Shift
  - LookupKey: "B"
    $name: Quick Lookup hotkey key
    $description: 'Type Space, or a single A-Z or 0-9 key. Falls back to Space if left blank or invalid. Bunbun defaults to B (Ctrl+Alt+B, "Ask Bun"): Ctrl+Alt+Space is taken by the Claude desktop app.'
  $name: Shortcuts & Hotkeys
- Bunbun:
  - Agents: true
    $name: Coding agents
    $description: Show Claude Code, Antigravity, Cursor and VS Code / Copilot sessions (and any agent that runs the hook command) and approval cards on the island.
  - ShellApprovals: false
    $name: Ask before shell commands
    $description: Cursor and Antigravity don't tell Bunbun when they would ask for permission, so Bunbun can instead pause every shell command for an Allow / Deny card on the island. Claude Code and Copilot always get cards when they would ask.
  - Mascot: true
    $name: Bun mascot
    $description: Show your mascot on agent pills, approval cards and the Ask Bun box.
  - AmbientFps: 30
    $name: Ambient frame rate
    $description: Frame rate for continuously moving content (waveform, marquees) while the island is not resizing. Resizing always uses the full refresh rate.
  - MascotOnIsland: true
    $name: Mascot on the island
    $description: Show the mascot beside the clock and the music pill. With music playing it puts on headphones and vibes.
  - UpdateCheck: true
    $name: Check for updates automatically
    $description: Once a day, ask GitHub whether a newer Bunbun has been released, and show a notification if so. Nothing is downloaded or installed for you; the notification opens the release page.
  - BatteryMoods: true
    $name: Battery moods
    $description: On laptops, the mascot holds a little plug while charging, gets drowsy below 15% and cheers when the battery is full.
  - ChargingReminderMinutes: 15
    $name: Charging update every (minutes)
    $description: While the battery charges, show its level (and time to full) this often. 0 turns it off.
  - LocalAi: false
    $name: Local AI
    $description: When Bun doesn't understand a question, a small language model running offline on this PC answers it or turns it into a Bun command. Needs bunbun-brain.exe and a model file; see the Local AI guide. Nothing leaves your PC.
  - LocalAiModel: ""
    $name: Local AI model file
    $description: Full path to a .gguf model. Leave empty to use the first .gguf in %LOCALAPPDATA%\Bunbun\models.
  - LocalAiIdleMinutes: 5
    $name: Free the model's memory after (minutes)
    $description: The model (about 1-2 GB of memory) is unloaded after this long without a question, and loads again in a second or two when needed.
  - MascotDnd: false
    $name: Mascot do not disturb
    $description: The mascot settles in with its favourite snack and stops reacting. Independent of Windows' Do Not Disturb. Ask Bun "dnd on" or "dnd off" to switch it.
  - Character: bunny
    $name: Mascot character
    $description: bunny, cat, dog, fox, panda, robot, spiderman, luffy, dazai, or custom:<folder> for a skin pack in %APPDATA%\Bunbun\mascots
  - MascotColor: ""
    $name: Mascot colour
    $description: "Per-mascot colours, e.g. bunny=#F4B6C8;cat=#5B5868. A mascot without an entry keeps its own colour. Spidey, Luffy, Dazai and skin packs can't be recoloured."
  - MascotMotion: 100
    $name: Mascot motion (%)
    $description: 0 = still, 100 = default, 200 = lively.
  - MascotHop: 100
    $name: Celebration hop height (%)
  - MascotBlinkEvery: 4
    $name: Blink every (seconds)
    $description: 0 = never blink.
  - MascotEyesFollow: true
    $name: Eyes follow the cursor
  - MascotCelebrate: true
    $name: Hop when a task finishes
  - Assistant: true
    $name: Ask Bun
    $description: The Quick Lookup box (Ctrl+Alt+B) becomes Bun's command line - open apps and settings, media and volume, timers, web search, quick PC facts, math. Fully local. Type "define <word>" or "wiki <topic>" for the dictionary.
  - SearchEngine: google
    $name: Web search engine
    $options:
      - google: Google
      - bing: Bing
      - duckduckgo: DuckDuckGo
  - Layout: studio
    $name: Island layout
    $description: Studio (the default) frames the open island with a header (page name, date and time) and an icon tab bar with a volume slider, puts big Agent, Music and Focus tiles on the first page, and tints the music page with the album's colour. Classic is the original island without the frame.
    $options:
      - classic: Classic
      - studio: Studio
  - TuckHotkey: true
    $name: Tuck away (Ctrl+Alt+H)
    $description: Ctrl+Alt+H, or Tuck away in the right-click menu, hides the island to a thin line at the top of the screen, coloured by what's going on. Point at the line for a moment to bring the island back. It comes back by itself when an agent needs you.
  - AgentTab: true
    $name: Agent page
    $description: An Agent page in the scroll loop with a live timer, Read / Edit / Test / Done progress, the last command and its output, tasks done today, recent tasks, and your Claude Code usage limits (connect Claude Code to see them).
  - ClipboardHistory: true
    $name: Clipboard history
    $description: A Clipboard page with the last 8 texts you copied, kept in memory only. Click one to copy it again.
  - QuickNote: true
    $name: Quick note
    $description: A Note page with one note kept on this PC (note.txt next to settings.ini). Lines that start with [ ] get a checkbox you can tick on the island; Edit opens the note in Notepad.
  - PokeReactions: true
    $name: Poke reactions and hello
    $description: Poke the mascot three times quickly and it gets cross; six times and it gets dizzy. It also says hello when Bunbun starts.
  - MusicSwipe: true
    $name: Swipe for the next song
    $description: Swipe sideways on the small music pill, or scroll sideways on a touchpad, to skip to the next or previous song.
  - IdleFace: mascot
    $name: Idle face
    $description: What sits on the idle island. Mascot is your character; Eyes is just two eyes that follow your pointer and blink. Pick their colour in Eye colour.
    $options:
      - mascot: Mascot
      - eyes: Eyes
  - EyeColor: mint
    $name: Eye colour
    $description: The eyes' resting colour when Idle face is Eyes. While an agent works they turn orange and pulse; green when it's done; red on an error.
    $options:
      - mint: Mint
      - white: White
      - blue: Blue
      - pink: Pink
      - purple: Purple
      - yellow: Yellow
  - ShowClaude: true
    $name: Show Claude Code
    $description: Claude Code sessions, approval cards and usage on the island. Off ignores Claude Code completely; it asks in its own window as if Bunbun weren't there.
  - ShowAntigravity: true
    $name: Show Antigravity
    $description: Antigravity sessions, approval cards and quota on the island. Off ignores Antigravity completely.
  - ShowCursor: true
    $name: Show Cursor
    $description: Cursor agent and Composer sessions and approval cards on the island. Off ignores Cursor completely.
  - ShowCopilot: true
    $name: Show VS Code / Copilot
    $description: VS Code agent mode and Copilot CLI sessions and approval cards on the island. Off ignores them completely.
  - ShowCodex: true
    $name: Show Codex
    $description: OpenAI Codex sessions on the island (hooks you set up yourself). Off ignores Codex completely.
  - ShowOtherAgents: true
    $name: Show other tools
    $description: Any other tool that sends events with bunbun-hook --agent <name>.
  - AgentPill: true
    $name: Pill while an agent works
    $description: The small pill showing what your agent is doing right now (Runs, Edits, Reads...). Turn it off for a quieter island; it still asks you when an agent needs approval or an answer, and the Agent page keeps track.
  - PillLyrics: false
    $name: Lyrics on the small island
    $description: While music plays, the closed island shows the current lyric line instead of the song title. Also in the right-click menu under Lyrics.
  - MainAgent: auto
    $name: Main agent
    $description: Which agent the Home tile and the usage ring in the header follow. Auto follows the one you used last.
    $options:
      - auto: Auto (the one you used last)
      - claude: Claude Code
      - antigravity: Antigravity
      - cursor: Cursor
      - copilot: VS Code / Copilot
      - codex: Codex
  - UsageLimits: true
    $name: Show Claude Code usage limits
    $description: Your Claude Code 5-hour and weekly limits and context use, sent by its statusLine when Claude Code is connected. Shown as a ring in the Studio header, on the Claude tile, and as bars on the Agent page.
  - AntigravityQuota: true
    $name: Show Antigravity quota
    $description: How much of Antigravity's model quota you've used, from the status Antigravity keeps on this PC (refreshed when Antigravity syncs). Shows the model with the least left, its reset time, on the Agent page, and in the header and Claude tile when Claude Code has no numbers.
  - EyeStatusColors: false
    $name: Eyes show agent status
    $description: When on, the eyes turn orange and pulse while a coding agent works, go green when it's done and red on an error, and change shape with it. Off keeps them your chosen colour.
  - IdleStripItems: time-weather
    $name: Beside the face
    $description: What the small idle island shows next to the mascot or eyes. Nothing leaves just the face, like a little creature living in the notch.
    $options:
      - time-weather: Time and weather
      - time: Time only
      - weather: Weather only
      - nothing: Nothing (just the face)
  - HomeTile1: auto
    $name: First Home tile
    $description: Automatic shows your main agent, or the weather when no agent is on. Pick it in Settings, Island pages.
    $options:
      - auto: Automatic
      - agent: Agent
      - music: Music
      - focus: Focus timer
      - weather: Weather
      - calendar: Calendar
      - battery: Battery
      - system: System
  - HomeTile2: auto
    $name: Second Home tile
    $description: Automatic shows music. Pick it in Settings, Island pages.
    $options:
      - auto: Automatic
      - agent: Agent
      - music: Music
      - focus: Focus timer
      - weather: Weather
      - calendar: Calendar
      - battery: Battery
      - system: System
  - HomeTile3: auto
    $name: Third Home tile
    $description: Automatic shows the focus timer. Pick it in Settings, Island pages.
    $options:
      - auto: Automatic
      - agent: Agent
      - music: Music
      - focus: Focus timer
      - weather: Weather
      - calendar: Calendar
      - battery: Battery
      - system: System
  - HomeLinks: ""
    $name: Your links on Home
    $description: Up to four shortcuts under the Home tiles, as Name|address separated by semicolons, for example GitHub|https://github.com; Notes|C:\Users\you\Notes. Addresses can be websites, files, folders or programs.
  - PageOrder: ""
    $name: Page order
    $description: The order of the island's pages after Home (or the player), as page keys separated by commas, for example weather,calendar,focus. Pages left out keep their usual place after these. Easiest to set in Settings, Island pages.
  - AppsPage: true
    $name: All apps page
    $description: A page with every page of the island, the colour picker and Settings in one grid, with a badge when an agent is waiting for you.
  - BluetoothLowWarning: true
    $name: Low battery warning for Bluetooth devices
    $description: A heads-up on the island when connected headphones, a mouse or a keyboard drop to 20% or below. Checked every 5 minutes, at most once a day per device.
  - Sounds: true
    $name: Sounds
    $description: Soft chimes when a coding agent finishes, asks you something or stops with an error.
  - SoundOpenClose: false
    $name: Open and close sounds
    $description: A quick blip when the island opens and closes.
  - SoundVolume: 40
    $name: Sound volume (%)
    $description: How loud Bunbun's chimes are, on top of your Windows volume.
  - MirrorPage: false
    $name: Mirror page
    $description: A camera preview page for a quick look before a call. The camera only turns on when you press Turn on camera, and off when you leave the page. Nothing is saved.
  - FocusPage: true
    $name: Focus page
    $description: A Focus page in the scroll loop with an hours and minutes picker (scroll or click the numbers), 5 / 15 / 25 / 50 minute chips, +5 min, pause and stop.
  - FocusGuard: false
    $name: Focus guard
    $description: While a focus timer runs, a gentle note on the island when one of your distracting apps or sites comes to the front.
  - FocusGuardApps: "youtube, instagram, netflix, reddit, tiktok, twitter, x.com, facebook, steam, discord"
    $name: Distracting apps and sites
    $description: Comma-separated words matched against the front window's title and program name.
  - MusicApp: auto
    $name: Music app
    $description: What the Music tile opens. Auto brings the app that's playing to the front. With an app picked, the tile brings it forward when it's the one playing and opens it otherwise (YouTube Music opens in your browser).
    $options:
      - auto: Auto (whatever is playing)
      - spotify: Spotify
      - youtube-music: YouTube Music
      - apple-music: Apple Music
  $name: Bunbun
*/
// ==/BunbunSettings==
