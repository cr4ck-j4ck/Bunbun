# Publishes a GitHub Release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the VERSION file. The release gets one download, the
# installer (with the local AI helper, never a model), and its SHA256SUMS.txt,
# with notes taken from that version's CHANGELOG section. The portable zip is
# still built and kept as a run artifact, not published.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches VERSION
        run: |
          version="$(tr -d ' \r\n' < VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match VERSION ($version)." >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: settings-ui/package-lock.json

      - name: Set up toolchains
        run: ./scripts/setup.sh --local-ai --installer

      - name: Build
        env:
          BUNBUN_HOMEPAGE: https://github.com/${{ github.repository }}
        run: ./build.sh

      - name: Test
        run: ./tests/run.sh

      - name: Package
        run: |
          ./scripts/package.sh --no-build
          version="$(tr -d ' \r\n' < VERSION)"
          # A release without its installer would leave people with nothing to run.
          [ -f "dist/Bunbun-$version-setup.exe" ] || { echo "The installer wasn't built." >&2; exit 1; }
          (cd dist && sha256sum "Bunbun-$version-setup.exe" > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: bunbun-portable
          path: dist/Bunbun-*-win-x64.zip

      - name: Release notes from CHANGELOG
        run: |
          version="$(tr -d ' \r\n' < VERSION)"
          awk -v v="[$version]" '
            index($0, "## " v) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > dist/CHANGES.md
          {
            echo "**Install:** download \`Bunbun-$version-setup.exe\` below and run it. It installs for your"
            echo "account (no admin prompt) and replaces an older version in place. Windows may show a"
            echo "SmartScreen warning because the app isn't code-signed yet: choose **More info → Run anyway**."
            echo
            cat dist/CHANGES.md
          } > dist/NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d ' \r\n' < VERSION)"
          gh release create "$GITHUB_REF_NAME" \
            "dist/Bunbun-$version-setup.exe" dist/SHA256SUMS.txt \
            --title "Bunbun $version" --notes-file dist/NOTES.md
